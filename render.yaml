services:
  - type: web
    name: barbershop-app
    runtime: node
    buildCommand: npm run install:all && npm run build
    startCommand: node server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

      # ── Firebase (Firestore + FCM) ──────────────────────────────────────────
      # Get these from Firebase Console → Project Settings → Service Accounts
      - key: FIREBASE_PROJECT_ID
        sync: false          # fill in Render dashboard
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false          # paste the full key INCLUDING "-----BEGIN...-----END..."

      # ── JWT ────────────────────────────────────────────────────────────────
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure random value

      # ── Africa's Talking SMS (optional) ────────────────────────────────────
      - key: AT_API_KEY
        sync: false
      - key: AT_USERNAME
        sync: false

      # ── Chapa Payment (optional) ───────────────────────────────────────────
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: CHAPA_BASE_URL
        value: https://api.chapa.co/v1

      # ── Client-side Firebase (Vite build-time vars) ────────────────────────
      # These must be set so the React app is built with them baked in.
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_VAPID_KEY
        sync: false          # Web Push cert key from Firebase Console → Cloud Messaging
